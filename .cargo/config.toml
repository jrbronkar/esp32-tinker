[build]
target = "xtensa-esp32s3-none-elf"

[target.xtensa-esp32s3-none-elf]
runner = "espflash flash --monitor"
rustflags = [
  "-C", "link-arg=-nostartfiles",
  "-C", "link-arg=-Tlinkall.x",
]

# Rebuild core/alloc only for firmware commands, never for host tools or tests.
[alias]
esp-build = "build -Zbuild-std=core,alloc"
esp-run = "run -Zbuild-std=core,alloc"
esp-check = "check -Zbuild-std=core,alloc"
