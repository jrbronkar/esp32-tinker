[package]
name = "espctl"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
bytes = "1"
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"] }
tokio-stream = "0.1"
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen"] }
device-grpc = { path = "../../crates/device-grpc" }
clap = { version = "4.5", features = ["derive"] }
ota-protocol = { path = "../../crates/ota-protocol" }
ota-core = { path = "../../crates/ota-core" }
mdns-sd = "0.21"

[dev-dependencies]
embassy-futures = "0.1"
protolink = { git = "https://github.com/thives/protolink.rs.git", rev = "62cc2c87a687ba65fc6885e7c9691cefacf2d064", default-features = false, features = ["tokio"] }
edge-mdns = "0.8"
