[package]
name = "espctl"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
tower = { version = "0.5", default-features = false, features = ["util"] }
hyper-util = { version = "0.1", features = ["tokio"] }
bytes = "1"
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"] }
tokio-stream = "0.1"
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen"] }
clap = { version = "4.5", features = ["derive"] }
ota-protocol = { path = "../../crates/ota-protocol" }
ota-core = { path = "../../crates/ota-core" }
mdns-sd = "0.21"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }

[dev-dependencies]
micropb = "0.6"
embedded-http2 = { path = "../../crates/embedded-http2" }
embedded-grpc = { path = "../../crates/embedded-grpc" }
embedded-io-adapters = { version = "0.7", features = ["tokio-1"] }
management-grpc = { path = "../../crates/management-grpc" }
device-grpc = { path = "../../crates/device-grpc" }
embassy-futures = "0.1"
edge-mdns = "0.8"
