syntax = "proto3";
package esp.experimental;
import "ota.proto";
// Cleartext development HTTP/2 endpoint on port 7779. Upload supports explicit
// Commit after Finish; clients await each ACK before sending the next operation.
// The package name remains stable for clients of the initial prototype.
service Management {
  rpc ReadLogs(ota.ReadLogsRequest) returns (ota.ReadLogsResponse);
  rpc Logs(ota.ReadLogsRequest) returns (stream ota.ReadLogsResponse);
  rpc Upload(stream ota.UploadRequest) returns (stream ota.UploadResponse);
  rpc Status(ota.StatusRequest) returns (ota.StatusResponse);
}
