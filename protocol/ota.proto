syntax = "proto3";
package ota;

// All operations use protocol version 1. Uploads require a supported OTA partition layout.
message Request {
  uint32 protocol_version = 1;
  uint32 request_id = 2;
  oneof payload {
    StatusRequest status = 10;
    ReadLogsRequest read_logs = 12;
    BeginUpdate begin = 20;
    FirmwareChunk chunk = 21;
    FinishUpdate finish = 22;
    CommitUpdate commit = 23;
    AbortUpdate abort = 24;
  }
}
message StatusRequest {
  // Optional diagnostics; older firmware ignores this field.
  bool include_timings = 1;
  bool include_boot = 2;
}

message Response {
  uint32 protocol_version = 1;
  uint32 request_id = 2;
  oneof payload {
    StatusResponse status = 10;
    ErrorResponse error = 11;
    ReadLogsResponse logs = 12;
    UploadAck upload = 20;
  }
}
message StatusResponse {
  string device_id = 1;
  string chip = 2;
  string application = 3;
  string firmware_version = 4;
  uint64 uptime_ms = 5;
  bool ota_available = 6;
  // Absent on older firmware or when timing was not requested.
  DeviceTimings timings = 7;
  BootInfo boot = 8;
  // Empty on older firmware. Snapshot, not a health guarantee.
  string management_state = 9;
}
// Device monotonic elapsed wall time, including executor preemption.
// Encoding, enqueue, ACK, and close occur later and are logged over serial.
message DeviceTimings {
  // Reserved legacy measurement; zero for gRPC (handler receives a complete body).
  uint64 request_read_us = 1;
  uint64 decode_us = 2;
  uint64 prepare_us = 3;
}
message ErrorResponse {
  enum Code {
    UNSPECIFIED = 0;
    UNSUPPORTED_VERSION = 1;
    INVALID_REQUEST = 2;
  }
  Code code = 1;
  string message = 2;
}

// Read-only inventory. This does not assert OTA bootloader or rollback support.
message PartitionInfo {
  string label = 1;
  uint32 offset = 2;
  uint32 size = 3;
}
message BootInfo {
  // esp-storage derives capacity from the boot image header, not a JEDEC probe.
  uint32 configured_flash_size_bytes = 1;
  uint32 partition_count = 2;
  uint32 ota_app_partition_count = 3;
  bool has_ota_data = 4;
  PartitionInfo running = 5;
  PartitionInfo ota_0 = 6;
  PartitionInfo ota_1 = 7;
  bool layout_valid = 8;
  string error = 9;
}

message BeginUpdate {
  string application = 1;
  string chip = 2;
  string version = 3;
  uint32 image_size = 4;
  bytes sha256 = 5;
}
message FirmwareChunk { uint32 offset = 1; bytes data = 2; }
message FinishUpdate {}
message CommitUpdate {}
message AbortUpdate {}
message UploadAck {
  enum Phase { UNSPECIFIED = 0; RECEIVING = 1; VERIFIED = 2; COMMITTED = 3; ABORTED = 4; }
  Phase phase = 1;
  uint32 next_offset = 2;
  uint32 target_offset = 3;
}

// Cursors are scoped to a boot. Supply the returned boot_id on subsequent polls.
message ReadLogsRequest { uint64 boot_id = 1; uint64 after_sequence = 2; }
message LogEntry {
  uint64 sequence = 1;
  uint64 uptime_ms = 2;
  enum Severity { INFO = 0; WARN = 1; ERROR = 2; }
  Severity severity = 3;
  string message = 4;
}
message ReadLogsResponse {
  uint64 boot_id = 1;
  uint64 next_sequence = 2;
  bool reset = 3;
  bool dropped = 4;
  repeated LogEntry entries = 5;
}
