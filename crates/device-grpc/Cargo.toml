[package]
name = "device-grpc"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
embassy-futures = "0.1"
embassy-sync = "0.8"
ota-core = { path = "../ota-core" }
ota-protocol = { path = "../ota-protocol" }
protolink = { path = "../../vendor/protolink/protolink", default-features = false, features = ["async", "micropb"] }

[dev-dependencies]
protolink = { path = "../../vendor/protolink/protolink", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["macros", "rt", "time", "test-util"] }
