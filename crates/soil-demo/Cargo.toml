[package]
name = "soil-demo"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
wifi = ["dep:embassy-executor", "dep:embassy-time", "dep:esp-alloc", "dep:esp-rtos", "dep:heapless", "dep:wifi-telemetry"]

[dependencies]
embassy-executor = { version = "0.10.0", optional = true }
embassy-time = { version = "0.5.0", optional = true }
esp-alloc = { version = "0.10.0", features = ["esp32s3"], optional = true }
esp-backtrace = { version = "0.19.0", features = ["esp32s3", "panic-handler", "println"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32s3"] }
esp-hal = { version = "1.1.1", features = ["esp32s3", "rt", "unstable"] }
esp-println = { version = "0.17.0", features = ["esp32s3"] }
esp-rtos = { version = "0.3.0", features = ["embassy", "esp-radio", "esp32s3"], optional = true }
heapless = { version = "0.8.0", optional = true }
nb = "1.1.0"
onboard-rgb = { path = "../onboard-rgb" }
soil-sensor = { path = "../soil-sensor" }
wifi-telemetry = { path = "../wifi-telemetry", optional = true }
