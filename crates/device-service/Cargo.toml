[package]
name = "device-service"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
ota-protocol = { path = "../ota-protocol" }
embassy-executor = "0.10.0"
embassy-net = { version = "0.9.0", features = ["medium-ethernet", "tcp", "udp", "multicast"] }
embassy-time = "0.5.0"
esp-hal = { version = "1.1.1", features = ["esp32s3", "rt", "unstable"] }
esp-println = { version = "0.17.0", features = ["esp32s3"] }
heapless = "0.8.0"
esp-storage = { version = "=0.9.0", features = ["esp32s3"] }
embedded-storage = "0.3.1"
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32s3"] }
ota-core = { path = "../ota-core" }
edge-mdns = "0.8"
edge-nal = "0.7"
embassy-sync = "0.8"
embassy-futures = "0.1"
embedded-io-async = "0.7"
rand_core = { version = "0.10", default-features = false }
