[package]
name = "embedded-grpc"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
embedded-http2 = { path = "../embedded-http2" }
embedded-io-async = "0.7"
micropb = { version = "=0.6.0", default-features = false, features = ["encode", "decode"] }

[dev-dependencies]
bytes = "1"
embedded-io-adapters = { version = "0.7", features = ["tokio-1"] }
h2 = "0.4"
http = "1"
ota-protocol = { path = "../ota-protocol" }
tokio = { version = "1", features = ["io-util", "macros", "rt", "time"] }
