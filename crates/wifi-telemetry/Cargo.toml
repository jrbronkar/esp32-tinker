[package]
name = "wifi-telemetry"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
embassy-executor = "0.10.0"
embassy-net = { version = "0.9.0", features = ["dhcpv4", "medium-ethernet", "udp"] }
embassy-time = "0.5.0"
esp-hal = { version = "1.1.1", features = ["esp32s3", "rt", "unstable"] }
esp-println = { version = "0.17.0", features = ["esp32s3"] }
esp-radio = { version = "0.18.0", features = ["esp32s3", "wifi"] }
esp-rtos = { version = "0.3.0", features = ["embassy", "esp-radio", "esp32s3"] }
heapless = "0.8.0"
static_cell = "2.1.0"
