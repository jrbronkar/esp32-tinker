name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix-checks:
    name: Nix checks (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Format, lint, and test host code
        run: |
          nix develop --command bash -euo pipefail -c '
            cargo fmt --all -- --check
            cargo clippy --locked --all-targets -- -D warnings
            cargo build --locked
            cargo test --locked
          '
      - name: Exercise the dashboard in a pseudo-terminal
        run: |
          nix develop --command cargo build --locked -p espctl --bin espctl --example tui-update-smoke
          python3 tools/espctl/tests/tui_smoke.py target/debug/espctl target/debug/examples/tui-update-smoke
      - name: Lint and build ESP32-S3 firmware
        env:
          WIFI_SSID: build-check
          WIFI_PASSWORD: build-check
        run: |
          nix develop --command bash -euo pipefail -c '
            cargo clippy --locked --target xtensa-esp32s3-none-elf -Zbuild-std=core,alloc -p device-demo -- -D warnings
            cargo build --locked --target xtensa-esp32s3-none-elf -Zbuild-std=core,alloc --release -p device-demo
          '
